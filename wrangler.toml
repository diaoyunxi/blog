# Cloudflare Workers 配置（由 Cloudflare Pages 迁移而来）
# 关键变化：
#   pages_build_output_dir  ->  main = "worker.js" + [assets].directory
# compatibility_date 沿用原 Pages 配置，避免迁移时引入运行时行为变化；
# 需要新运行时特性时再单独提升。
# 部署：npm run deploy（= node build.mjs && wrangler deploy）

name = "diaoyunxi-blog"
main = "worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "dist"
binding = "ASSETS"

# 静态资产由边缘直出，不执行 Worker、不计入请求次数（免费且不限量）。
# 只有列在这里的路径才「先跑 Worker」；未来新增动态功能时把路径加进数组即可，
# 例如计数器 / 鉴权 / 订阅接口：run_worker_first = ["/api/*", "/private/*"]
# 切勿改回 true —— 那会让每张图片、每个 CSS 都算一次 Worker 调用。
run_worker_first = ["/api/*"]

# 未命中资产时由资产层直接返回 404.html；SPA 深链由 _redirects 的 200 rewrite 处理。
# 两者都不需要调用 Worker；真正需要动态逻辑的请求仍会落到 worker.js。
not_found_handling = "404-page"

# 本地预览：npm run dev
# 部署：    npm run deploy
