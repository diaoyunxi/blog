<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diaoyunxi · 博客</title>
  <meta name="description" content="由 Issue 驱动的 AI 双语博客，涵盖人工智能、工程实践与技术随笔。" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />

  <!-- 字体（外链） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- 站点样式（外链） -->
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/markdown.css" />
  <!-- 代码高亮主题 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="hljs-light" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljs-dark" disabled />
  <!-- KaTeX 公式样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />

  <!-- 渲染依赖（外链 CDN） -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="#/" data-link>
        <span class="brand__mark">d</span>
        <span class="brand__name-long">diaoyunxi<span style="color:var(--text-3);font-weight:400"> · 博客</span></span>
      </a>
      <nav class="nav-actions" aria-label="主导航">
        <div class="lang-switch" role="group" aria-label="语言切换">
          <button type="button" data-lang="zh-CN" aria-pressed="true">中文</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="切换主题" title="切换明暗主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="app" class="container">
    <div class="loading" id="loading">正在加载文章…</div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© <span id="year"></span> diaoyunxi · 由 Issue 驱动的 AI 双语博客</span>
      <span>
        <a href="https://github.com/diaoyunxi/blog" target="_blank" rel="noopener">GitHub</a>
        · <a href="rss.xml">RSS</a>
        · <a href="sitemap.xml">Sitemap</a>
      </span>
    </div>
  </footer>

  <noscript>
    <div class="container" style="padding:48px 0;color:var(--text-2)">
      本博客需要 JavaScript 来渲染 Markdown 文章。你也可直接访问仓库中的
      <code>blog/</code> 目录阅读原始 Markdown 文件。
    </div>
  </noscript>

  <script src="assets/js/app.js"></script>
</body>
</html>
