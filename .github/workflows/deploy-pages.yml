name: Deploy site to Cloudflare Pages

# 每次 main 分支有推送（Issue Agent 自动新增文章时也会触发），
# 重新构建静态站点并部署到 Cloudflare Pages。
# 构建产物 dist/ 由 build.mjs 生成：扫描 blog/ 下的 cn.md / en.md，
# 输出 posts.json（文章索引）、rss.xml、sitemap.xml。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build site
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: diaoyunxi-blog
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
