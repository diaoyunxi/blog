name: Issue → Blog (CN) Agent

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "要处理的 Issue 编号（手动调试用）"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: issue-blog-agent-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  write-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 任何人新建的 Issue 都会触发（已移除作者身份限制）。
    # 提示词注入风险已由 main.py 的落盘约束承担：
    #   目录名强制中文 + 只写 cn.md + 改动白名单仅 .md，正文内容无法影响仓库代码。

    env:
      BLOG_DIR: ${{ vars.BLOG_DIR || 'blog' }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || '0.2' }}
      SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'auto' }}
      SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
      SEARCH_REGION: ${{ vars.SEARCH_REGION || 'cn-zh' }}
      SEARCH_LANG: ${{ vars.SEARCH_LANG || 'zh-cn' }}
      MAX_ROUNDS: ${{ vars.MAX_ROUNDS || '16' }}
      MAX_429_RETRIES: ${{ vars.MAX_429_RETRIES || '5' }}
      BASE_BACKOFF: ${{ vars.BASE_BACKOFF || '2' }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      # Agent 最多尝试次数：diff 校验不过就丢弃重跑，用完仍未产出合法 .md 改动则失败
      MAX_ATTEMPTS: ${{ vars.MAX_ATTEMPTS || '2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/ci/requirements.txt

      - name: 收集 Issue 内容（走 env/文件，避免正文里的特殊字符破坏 shell）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 手动调试：用 gh 读取 issue 内容
            gh issue view "$ISSUE_NUMBER" --json title,body,url,author,createdAt \
              > "$RUNNER_TEMP/issue/raw.json"
            python - <<'PY'
          import json, os, pathlib
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "issue"
          d = json.loads((tmp / "raw.json").read_text(encoding="utf-8"))
          (tmp / "title.md").write_text(d.get("title", ""), encoding="utf-8")
          (tmp / "body.md").write_text(d.get("body") or "", encoding="utf-8")
          author = (d.get("author") or {}).get("login", "")
          env_lines = [
              f"ISSUE_URL={d.get('url','')}",
              f"ISSUE_AUTHOR={author}",
              f"ISSUE_CREATED_AT={d.get('createdAt','')}",
          ]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("\n".join(env_lines) + "\n")
          PY
          else
            printf '%s' "$ISSUE_TITLE" > "$RUNNER_TEMP/issue/title.md"
            printf '%s' "$ISSUE_BODY"  > "$RUNNER_TEMP/issue/body.md"
            {
              echo "ISSUE_URL=$ISSUE_URL"
              echo "ISSUE_AUTHOR=$ISSUE_AUTHOR"
              echo "ISSUE_CREATED_AT=$ISSUE_CREATED_AT"
            } >> "$GITHUB_ENV"
          fi

          if [ ! -s "$RUNNER_TEMP/issue/body.md" ]; then
            echo "::error::issue 正文为空，跳过"
            exit 1
          fi
          {
            echo "ISSUE_TITLE_FILE=$RUNNER_TEMP/issue/title.md"
            echo "ISSUE_BODY_FILE=$RUNNER_TEMP/issue/body.md"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 运行 Agent：最多 MAX_ATTEMPTS 次
      # 每次先重置工作区到干净状态；产出后校验 diff —— 只允许 .md 后缀改动，
      # 出现任何非 .md 改动就丢弃本次结果并整轮重跑；全部尝试用完才判失败。
      # ------------------------------------------------------------------
      # ------------------------------------------------------------------
      # 预先算出「本次 Issue 提出者可改动的文件清单」，交给 Agent 参考，
      # 让它不要去改/删别人创建的文章（CI 后面还会再强制校验一次）
      # ------------------------------------------------------------------
      - name: 生成提出者可改动清单
        id: owned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -uo pipefail
          ACTOR="${ISSUE_AUTHOR:-}"
          if [ -z "$ACTOR" ]; then
            echo "::warning::未取到 Issue 提出者，清单置空（Agent 只能新增）"
            echo '{"owned":[],"others":[]}' > "$RUNNER_TEMP/owned.json"
          else
            python .github/ci/check_changes.py owned \
              --mode git --actor "$ACTOR" --prefix "$BLOG_DIR" \
              --out "$RUNNER_TEMP/owned.json" || echo '{"owned":[],"others":[]}' > "$RUNNER_TEMP/owned.json"
          fi
          echo "OWNED_MAP_FILE=$RUNNER_TEMP/owned.json" >> "$GITHUB_ENV"
          python3 -c "
          import json,pathlib
          d=json.load(open('$RUNNER_TEMP/owned.json'))
          print('可改动', len(d.get('owned',[])), '个；不可改动', len(d.get('others',[])), '个')
          for p in d.get('owned',[]): print('  ✓', p)
          "

      - name: 运行 Agent（.md 校验 + 归属校验，不满足则丢弃重跑）
        id: agent
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          ATTEMPTS="${MAX_ATTEMPTS:-2}"
          case "$ATTEMPTS" in ''|*[!0-9]*) ATTEMPTS=2 ;; esac
          [ "$ATTEMPTS" -lt 1 ] && ATTEMPTS=1

          # 本次操作者 = 开 Issue 的人（workflow_dispatch 时由前一步写入 GITHUB_ENV）
          ACTOR="${ISSUE_AUTHOR:-}"
          echo "本次操作者：$ACTOR"

          reset_workspace() {
            git reset --hard HEAD >/dev/null 2>&1 || true
            git clean -fdq >/dev/null 2>&1 || true
          }

          # 把 git diff --name-status 转成 [{"path","status"}] 的 JSON
          changes_json() {
            git -c core.quotepath=false diff --cached --name-status | python3 -c '
          import sys, json
          items = []
            for line in sys.stdin:
                line = line.rstrip("\n")
                if not line.strip():
                    continue
                parts = line.split("\t")
                st = parts[0].strip()
                path = (parts[-1] if len(parts) > 1 else "").strip()
                prev = (parts[1].strip() if len(parts) > 2 and st.startswith("R") else "")
                if not path:
                    continue
                items.append({"path": path, "status": st, "previous_filename": prev})
            print(json.dumps(items, ensure_ascii=False))
            '
          }

          ok=0
          attempt=1
          while [ "$attempt" -le "$ATTEMPTS" ]; do
            echo "::group::Agent 第 $attempt/$ATTEMPTS 次尝试"
            reset_workspace

            python .github/ci/main.py 2>&1 | tee "$RUNNER_TEMP/agent.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              echo "::warning::第 $attempt 次 Agent 运行失败（exit $rc）"
              attempt=$((attempt + 1))
              continue
            fi

            git add -A
            CHANGED="$(git -c core.quotepath=false diff --cached --name-only || true)"
            if [ -z "$CHANGED" ]; then
              echo "::warning::第 $attempt 次运行未产生任何文件改动"
              git reset -q >/dev/null 2>&1 || true
              attempt=$((attempt + 1))
              continue
            fi

            # —— 守卫一：改动必须全是 .md ——
            NON_MD="$(printf '%s\n' "$CHANGED" | sed '/^[[:space:]]*$/d' | grep -vE '\.md$' || true)"
            if [ -n "$NON_MD" ]; then
              echo "::warning::第 $attempt 次的改动包含非 .md 文件，丢弃本次结果并重跑"
              printf '%s\n' "$NON_MD" | sed 's/^/  ✗ /'
              reset_workspace
              attempt=$((attempt + 1))
              continue
            fi
            echo "✅ 第 $attempt 次 .md 校验通过："
            printf '%s\n' "$CHANGED" | sed 's/^/  ✓ /'

            # —— 守卫二：新增放行，修改/删除必须是本人创建的文件 ——
            changes_json > "$RUNNER_TEMP/changes.json"
            python .github/ci/check_changes.py check \
              --mode git --actor "$ACTOR" --prefix "$BLOG_DIR" \
              --files-json "$RUNNER_TEMP/changes.json"
            oc_rc=$?
            if [ "$oc_rc" -ne 0 ]; then
              echo "::warning::第 $attempt 次的改动涉及他人创建的文件，丢弃本次结果并重跑"
              reset_workspace
              attempt=$((attempt + 1))
              continue
            fi

            echo "✅ 第 $attempt 次归属校验通过"
            echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
            ok=1
            break
          done

          if [ "$ok" != "1" ]; then
            reset_workspace
            echo "::error::Agent 连续 $ATTEMPTS 次未产出合法改动（需同时通过：仅 .md + 仅改动本人创建的文件），放弃"
            exit 1
          fi

      - name: 上传 Agent 执行轨迹
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-trace-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-trace.md
          if-no-files-found: warn

      - name: Agent 失败详情回帖
        if: steps.agent.outcome == 'failure'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          TRACE_TAIL: ${{ steps.agent.outputs.trace_tail }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ERR=$(grep -a '::error::' "$RUNNER_TEMP/agent.log" | sed 's/^::error:://' | tail -n 3 || true)
          [ -z "$ERR" ] && ERR="（无 ::error:: 输出）"
          printf '%s' "${TRACE_TAIL:-（无轨迹）}" > "$RUNNER_TEMP/trace-tail.txt"
          {
            echo "❌ Agent 执行失败（已重跑 ${MAX_ATTEMPTS} 次，仍未产出仅含 .md 的合法改动）："
            echo
            echo '```'
            echo "$ERR"
            echo '```'
            echo
            echo "<details><summary>完整执行轨迹（尾部）</summary>"
            echo
            echo '```text'
            tail -n 60 "$RUNNER_TEMP/trace-tail.txt"
            echo '```'
            echo "</details>"
            echo
            echo "完整轨迹见 artifact \`agent-trace-${GITHUB_RUN_ID}\`：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md" || true
          {
            echo "### ❌ Agent 失败详情"
            echo
            echo '```'
            cat "$RUNNER_TEMP/trace-tail.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # ------------------------------------------------------------------
      # 不开 PR：直接在主分支上提交并推送
      # ------------------------------------------------------------------
      - name: 提交并推送到主分支
        if: steps.agent.outcome == 'success'
        id: push
        env:
          TITLE: ${{ steps.agent.outputs.title }}
          CN_PATH: ${{ steps.agent.outputs.cn_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          SUMMARY: ${{ steps.agent.outputs.summary }}
          FULL_DIR: ${{ steps.agent.outputs.full_dir }}
          OPERATION: ${{ steps.agent.outputs.operation }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          CHANGED="$(git -c core.quotepath=false diff --cached --name-only || true)"
          if [ -z "$CHANGED" ]; then
            echo "::error::没有待提交的改动"
            exit 1
          fi

          # 提交前再做一次守卫：绝不允许非 .md 文件进入主分支
          NON_MD="$(printf '%s\n' "$CHANGED" | sed '/^[[:space:]]*$/d' | grep -vE '\.md$' || true)"
          if [ -n "$NON_MD" ]; then
            echo "::error::提交前校验发现非 .md 改动，已终止推送："
            printf '%s\n' "$NON_MD" | sed 's/^/  ✗ /'
            git reset -q --hard HEAD
            git clean -fdq
            exit 1
          fi

          # 提交前再校验归属：修改/删除必须是本人创建的文件
          git -c core.quotepath=false diff --cached --name-status | python3 -c '
          import sys, json
          items = []
          for line in sys.stdin:
              line = line.rstrip("\n")
              if not line.strip():
                  continue
              parts = line.split("\t")
              st = parts[0].strip()
              path = (parts[-1] if len(parts) > 1 else "").strip()
              prev = (parts[1].strip() if len(parts) > 2 and st.startswith("R") else "")
              if path:
                  items.append({"path": path, "status": st, "previous_filename": prev})
          open("$RUNNER_TEMP/changes-final.json", "w", encoding="utf-8").write(json.dumps(items, ensure_ascii=False))
          '
          python .github/ci/check_changes.py check \
            --mode git --actor "${ISSUE_AUTHOR:-}" --prefix "$BLOG_DIR" \
            --files-json "$RUNNER_TEMP/changes-final.json"
          if [ $? -ne 0 ]; then
            echo "::error::提交前归属校验未通过，已终止推送"
            git reset -q --hard HEAD
            git clean -fdq
            exit 1
          fi

          OP_CN="$(case "$OPERATION" in remove) echo 删除 ;; update) echo 修改 ;; *) echo 新增 ;; esac)"
          git commit -m "$TITLE" -m "由 Issue #$ISSUE_NUMBER 自动${OP_CN}中文文章

          操作: $OPERATION
          目录: $FULL_DIR
          Issue: $ISSUE_URL
          摘要: $SUMMARY

          Closes #$ISSUE_NUMBER"

          # 与主分支最新进度对齐后再推（并发场景下降低冲突概率）
          git pull --rebase origin "$BASE_BRANCH"
          git push origin "HEAD:$BASE_BRANCH"

          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA" >> "$GITHUB_OUTPUT"
          echo "files=$(printf '%s\n' "$CHANGED" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          {
            echo "### 🚀 已直接推送到 \`$BASE_BRANCH\`"
            echo
            echo "- 提交：[\`${SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA)"
            echo "- 目录：\`$FULL_DIR\`"
            echo "- 文件：\`$CN_PATH\`"
            echo "- 摘要：$SUMMARY"
            echo "- Agent 尝试次数：${{ steps.agent.outputs.attempts }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 在原 Issue 回帖结果
        if: steps.push.outputs.commit_url != ''
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          COMMIT_URL: ${{ steps.push.outputs.commit_url }}
          SHORT_SHA: ${{ steps.push.outputs.short_sha }}
          FULL_DIR: ${{ steps.agent.outputs.full_dir }}
          CN_PATH: ${{ steps.agent.outputs.cn_path }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          ATTEMPTS: ${{ steps.agent.outputs.attempts }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "🤖 已生成中文文章并直接推送到 \`$BASE_BRANCH\`

          - 目录：\`${FULL_DIR}\`
          - 文件：\`${CN_PATH}\`
          - 提交：[\`${SHORT_SHA}\`](${COMMIT_URL})
          - Agent 尝试次数：${ATTEMPTS:-1}

          改动已校验仅包含 .md 文件，未创建 PR。内容由 AI 联网检索生成，请留意事实与链接的准确性。" || true

      - name: 回帖执行轨迹（调试用，需 vars.TRACE_COMMENT=true）
        if: steps.agent.outcome == 'success' && vars.TRACE_COMMENT == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          TRACE_TAIL: ${{ steps.agent.outputs.trace_tail }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${TRACE_TAIL:-（无轨迹）}" > "$RUNNER_TEMP/trace-tail.txt"
          {
            echo "### 🧾 Agent 执行轨迹（调试）"
            echo
            echo '```text'
            tail -n 80 "$RUNNER_TEMP/trace-tail.txt"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md" || true

      - name: 失败时回帖
        if: failure() && steps.agent.outcome != 'failure'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "⚠️ 自动生成文章失败（非 Agent 环节），请查看 Actions 日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
