name: Issue → Blog (CN) Agent

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "要处理的 Issue 编号（手动调试用）"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-blog-agent-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  write-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 安全：默认只对仓库成员/协作者创建的 issue 自动跑，避免外部输入触发 AI 写文件
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)

    env:
      BLOG_DIR: ${{ vars.BLOG_DIR || 'blog' }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || '0.2' }}
      SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'auto' }}
      SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
      SEARCH_REGION: ${{ vars.SEARCH_REGION || 'cn-zh' }}
      SEARCH_LANG: ${{ vars.SEARCH_LANG || 'zh-cn' }}
      MAX_ROUNDS: ${{ vars.MAX_ROUNDS || '16' }}
      MAX_429_RETRIES: ${{ vars.MAX_429_RETRIES || '5' }}
      BASE_BACKOFF: ${{ vars.BASE_BACKOFF || '2' }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/ci/requirements.txt

      - name: 收集 Issue 内容（走 env/文件，避免正文里的特殊字符破坏 shell）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 手动调试：用 gh 读取 issue 内容
            gh issue view "$ISSUE_NUMBER" --json title,body,url,author,createdAt \
              > "$RUNNER_TEMP/issue/raw.json"
            python - <<'PY'
          import json, os, pathlib
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "issue"
          d = json.loads((tmp / "raw.json").read_text(encoding="utf-8"))
          (tmp / "title.md").write_text(d.get("title", ""), encoding="utf-8")
          (tmp / "body.md").write_text(d.get("body") or "", encoding="utf-8")
          author = (d.get("author") or {}).get("login", "")
          env_lines = [
              f"ISSUE_URL={d.get('url','')}",
              f"ISSUE_AUTHOR={author}",
              f"ISSUE_CREATED_AT={d.get('createdAt','')}",
          ]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("\n".join(env_lines) + "\n")
          PY
          else
            printf '%s' "$ISSUE_TITLE" > "$RUNNER_TEMP/issue/title.md"
            printf '%s' "$ISSUE_BODY"  > "$RUNNER_TEMP/issue/body.md"
            {
              echo "ISSUE_URL=$ISSUE_URL"
              echo "ISSUE_AUTHOR=$ISSUE_AUTHOR"
              echo "ISSUE_CREATED_AT=$ISSUE_CREATED_AT"
            } >> "$GITHUB_ENV"
          fi

          if [ ! -s "$RUNNER_TEMP/issue/body.md" ]; then
            echo "::error::issue 正文为空，跳过"
            exit 1
          fi
          {
            echo "ISSUE_TITLE_FILE=$RUNNER_TEMP/issue/title.md"
            echo "ISSUE_BODY_FILE=$RUNNER_TEMP/issue/body.md"
          } >> "$GITHUB_ENV"

      - name: 运行 Agent 生成 cn.md
        id: agent
        continue-on-error: true
        run: |
          set -o pipefail
          python .github/ci/main.py 2>&1 | tee "$RUNNER_TEMP/agent.log"
          exit "${PIPESTATUS[0]}"

      - name: 上传 Agent 执行轨迹
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-trace-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-trace.md
          if-no-files-found: warn

      - name: Agent 失败详情回帖
        if: steps.agent.outcome == 'failure'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          TRACE_TAIL: ${{ steps.agent.outputs.trace_tail }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ERR=$(grep -a '::error::' "$RUNNER_TEMP/agent.log" | sed 's/^::error:://' | tail -n 3 || true)
          [ -z "$ERR" ] && ERR="（无 ::error:: 输出）"
          printf '%s' "${TRACE_TAIL:-（无轨迹）}" > "$RUNNER_TEMP/trace-tail.txt"
          {
            echo "❌ Agent 执行失败："
            echo
            echo '```'
            echo "$ERR"
            echo '```'
            echo
            echo "<details><summary>完整执行轨迹（尾部）</summary>"
            echo
            echo '```text'
            tail -n 60 "$RUNNER_TEMP/trace-tail.txt"
            echo '```'
            echo "</details>"
            echo
            echo "完整轨迹见 artifact \`agent-trace-${GITHUB_RUN_ID}\`：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md" || true
          {
            echo "### ❌ Agent 失败详情"
            echo
            echo '```'
            cat "$RUNNER_TEMP/trace-tail.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 建分支、提交、推送
        if: steps.agent.outputs.created == 'true'
        env:
          BRANCH: ${{ steps.agent.outputs.branch }}
          TITLE: ${{ steps.agent.outputs.title }}
          CN_PATH: ${{ steps.agent.outputs.cn_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          SUMMARY: ${{ steps.agent.outputs.summary }}
          FULL_DIR: ${{ steps.agent.outputs.full_dir }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          git add "$CN_PATH"
          git commit -m "$TITLE" -m "由 Issue #$ISSUE_NUMBER 自动生成中文文章

          目录: $FULL_DIR
          Issue: $ISSUE_URL
          摘要: $SUMMARY"
          git push origin "$BRANCH"

      - name: 创建 PR
        if: steps.agent.outputs.created == 'true'
        id: pr
        env:
          BRANCH: ${{ steps.agent.outputs.branch }}
          TITLE: ${{ steps.agent.outputs.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          SUMMARY: ${{ steps.agent.outputs.summary }}
          FULL_DIR: ${{ steps.agent.outputs.full_dir }}
          CN_PATH: ${{ steps.agent.outputs.cn_path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BODY="Closes #$ISSUE_NUMBER

          由 Issue #$ISSUE_NUMBER 自动生成的中文文章。

          - 目录：\`$FULL_DIR\`
          - 文件：\`$CN_PATH\`
          - 摘要：$SUMMARY

          > 本 PR 由 AI Agent 生成，请人工校对事实与链接后再合并。"

          echo "分支：$BRANCH → $BASE_BRANCH"
          set +e
          PR_URL=$(gh pr view "$BRANCH" --json url --jq .url 2>"$RUNNER_TEMP/pr-view.err")
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "尚无 PR，准备创建…"
            PR_URL=$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "$TITLE" --body "$BODY" 2>&1 | tee "$RUNNER_TEMP/pr-create.log" | grep -E '^https://' | tail -1)
            if [ -z "$PR_URL" ]; then
              echo "::error::创建 PR 失败，gh 输出如下："
              cat "$RUNNER_TEMP/pr-create.log"
              echo "::error::请确认仓库 Settings → Actions → General 已勾选 'Allow GitHub Actions to create and approve pull requests'"
              exit 1
            fi
          fi
          PR_NUMBER=$(gh pr view "$BRANCH" --json number --jq .number)
          echo "pr_url=$PR_URL"     >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: 在原 Issue 评论 PR 编号
        if: steps.pr.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          FULL_DIR: ${{ steps.agent.outputs.full_dir }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "🤖 已生成中文文章并提交 PR：#${PR_NUMBER}
          - 目录：\`${FULL_DIR}\`
          - 链接：${PR_URL}

          内容由 AI 联网检索生成，合并前请人工校对。"

      - name: 回帖执行轨迹（调试用，需 vars.TRACE_COMMENT=true）
        if: steps.pr.outputs.pr_number != '' && vars.TRACE_COMMENT == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          TRACE_TAIL: ${{ steps.agent.outputs.trace_tail }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${TRACE_TAIL:-（无轨迹）}" > "$RUNNER_TEMP/trace-tail.txt"
          {
            echo "### 🧾 Agent 执行轨迹（调试）"
            echo
            echo '```text'
            tail -n 80 "$RUNNER_TEMP/trace-tail.txt"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md" || true

      - name: 失败时回帖
        if: failure() && steps.agent.outcome != 'failure'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "⚠️ 自动生成文章失败（非 Agent 环节），请查看 Actions 日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
